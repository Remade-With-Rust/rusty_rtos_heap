[package]
name = "rusty_rtos_heap"
description = "FreeRTOS heap_1 / heap_4 / heap_5 remade in Rust behind the Heap seam, with the heap protector; heap_3 as the seam over rusty_alloc small-metal and esp-alloc; static allocation first-class."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/rusty_rtos_heap"
keywords = ["rtos", "freertos", "embedded", "no-std", "remade-with-rust"]
categories = ["embedded", "no-std", "os"]

[features]
default = ["std"]
std = ["rusty_rtos_heap-core/std"]
alloc = ["rusty_rtos_heap-core/alloc"]

[dependencies]
rusty_rtos_heap-core = { workspace = true }

[lints]
workspace = true
